name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RuleGo engineering documentation
        run: python3 scripts/validate.py

  budva-to-es:
    runs-on: ubuntu-latest
    # Runs the committed example JS through the real rulego v1.0.0 goja
    # engine (parser_test.go) and asserts chain.json embeds the tested script.
    # Anchored to external facts (RFC vectors, Go-stdlib HMAC reference, the
    # plugin message contract); see examples/budva-to-es/README.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        working-directory: examples/budva-to-es
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: examples/budva-to-es
        run: go vet ./...
      - name: go test
        working-directory: examples/budva-to-es
        run: go test ./...
      - name: go test -race
        working-directory: examples/budva-to-es
        run: go test -race ./...
